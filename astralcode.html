<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstralCode IDE | Sleek</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Ace Editor & Extensions -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.2/ace.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.2/ext-language_tools.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.2/ext-modelist.js"></script>

    <style>
        /* --- SLEEK MONOCHROME THEME --- */
        :root {
            --bg-base: #000000;
            --bg-panel: #0a0a0a;
            --bg-hover: #171717;
            --accent-primary: #ffffff;
            --accent-primary-hover: #e5e5e5;
            --accent-secondary: #a3a3a3;
            --text-main: #ffffff;
            --text-muted: #737373;
            --border-color: #262626;
            --danger: #ef4444;

            --font-ui: 'Inter', -apple-system, sans-serif;
            --font-code: 'Fira Code', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: var(--font-ui);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* --- HEADER & NAVIGATION --- */
        header {
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            height: 55px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 10;
        }

        .logo {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .logo i {
            color: var(--accent-primary);
            font-size: 1.5rem;
        }

        .spaces-nav {
            display: flex;
            gap: 8px;
            overflow-x: auto;
        }

        .space-tab {
            padding: 6px 16px;
            cursor: pointer;
            border: 1px solid transparent;
            border-radius: 4px;
            background: transparent;
            color: var(--text-muted);
            font-family: var(--font-ui);
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .space-tab:hover {
            color: var(--text-main);
            background: var(--bg-hover);
        }

        .space-tab.active {
            color: #000;
            background: var(--accent-primary);
            border-color: var(--accent-primary);
        }

        /* --- BUTTONS --- */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-hover);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s ease;
            font-family: var(--font-ui);
            font-size: 0.85rem;
            font-weight: 500;
        }

        .btn:hover {
            background: var(--border-color);
        }

        .btn-primary {
            background: var(--accent-primary);
            color: #000;
            border-color: var(--accent-primary);
            font-weight: 600;
        }

        .btn-primary:hover {
            background: var(--accent-primary-hover);
            border-color: var(--accent-primary-hover);
        }

        /* --- WORKSPACE LAYOUT --- */
        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 260px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .file-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .file-item {
            padding: 10px 12px;
            cursor: pointer;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-family: var(--font-code);
            transition: all 0.1s ease;
            border-left: 2px solid transparent;
        }

        .file-item:hover {
            background: var(--bg-hover);
            color: var(--text-main);
        }

        .file-item.active {
            background: var(--bg-hover);
            color: var(--accent-primary);
            border-left: 2px solid var(--accent-primary);
        }

        .file-item-name {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .delete-file {
            color: var(--text-muted);
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .delete-file:hover {
            color: var(--bg-panel);
            background: var(--danger);
        }

        /* --- EDITOR AREA --- */
        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-base);
            position: relative;
        }

        .editor-toolbar {
            background: var(--bg-panel);
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            height: 45px;
        }

        .file-breadcrumbs {
            font-family: var(--font-code);
            font-size: 0.85rem;
            color: var(--accent-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .editor-wrapper {
            flex: 1;
            position: relative;
        }

        #code-editor {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            font-family: var(--font-code);
        }

        /* --- PREVIEW AREA --- */
        .preview-container {
            width: 45%;
            background: var(--bg-base);
            display: flex;
            flex-direction: column;
            border-left: 1px solid var(--border-color);
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .preview-container.hidden {
            width: 0;
            border-left: none;
        }

        .preview-header {
            background: var(--bg-panel);
            height: 45px;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        iframe {
            flex: 1;
            border: none;
            width: 100%;
            background: #ffffff;
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-panel); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i class="ph-fill ph-code"></i>
            <span>AstralCode</span>
        </div>
        <div class="spaces-nav" id="spaces-nav"></div>
        <div>
            
        </div> 
    </header>

    <div class="workspace">
        <div class="sidebar">
            <div class="sidebar-header">
                <button class="btn btn-primary" style="width: 100%; justify-content: center;" onclick="addFile()">
                    <i class="ph ph-plus"></i> New File
                </button>
            </div>
            <div class="file-list" id="file-list"></div>
        </div>

        <div class="editor-container">
            <div class="editor-toolbar">
                <div class="file-breadcrumbs">
                    <i class="ph ph-file-code"></i>
                    <span id="current-file-name">No file selected</span>
                </div>
                <button class="btn" id="toggle-preview-btn" onclick="togglePreview()">
                    <i class="ph ph-layout"></i> <span id="preview-btn-text">Hide Preview</span>
                </button>
            </div>
            <div class="editor-wrapper">
                <div id="code-editor"></div>
            </div>
        </div>

        <div class="preview-container" id="preview-container">
            <div class="preview-header">
                <span style="display: flex; align-items: center; gap: 8px;">
                    <i class="ph ph-browser"></i> Preview
                </span>
                <button class="btn" style="padding: 4px 10px; font-size: 0.75rem;" onclick="openInNewTab()">
                    <i class="ph ph-arrow-square-out"></i> Pop Out
                </button>
            </div>
            <iframe id="preview-frame" sandbox="allow-scripts allow-modals"></iframe>
        </div>
    </div>

    <script>
        const DEFAULT_HTML = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;600&display=swap');
    body {
      background: #000; color: #fff; font-family: 'Inter', sans-serif;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 100vh; margin: 0;
    }
    .card { background: #0a0a0a; padding: 50px; border-radius: 4px; border: 1px solid #262626; text-align: center; max-width: 400px; }
    h1 { font-weight: 600; letter-spacing: -1px; margin-bottom: 16px; }
    p { color: #a3a3a3; font-weight: 300; line-height: 1.6; }
    .badge { display: inline-block; padding: 4px 12px; border: 1px solid #fff; border-radius: 50px; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Universal Code</div>
    <h1>AstralCode IDE</h1>
    <p>A minimalist workspace. Add .py, .java, .cpp, or any file extension to see syntax highlighting.</p>
  </div>
</body>
</html>`;

        const createDefaultSpaces = () => {
            return Array.from({ length: 3 }, (_, i) => ({
                id: i,
                name: `Space ${i + 1}`,
                files: [
                    { name: 'index.html', content: i === 0 ? DEFAULT_HTML : `<h1>Space ${i + 1} Ready</h1>` },
                    { name: 'script.py', content: 'def hello_world():\n    print("AstralCode supports Python now!")\n\nhello_world()' },
                    { name: 'app.js', content: 'console.log("System initialized.");' }
                ]
            }));
        };

        let spacesData = JSON.parse(localStorage.getItem('astralCodeData_sleek_universal'));
        if (!spacesData || spacesData.length === 0) {
            spacesData = createDefaultSpaces();
        }

        let currentSpaceIndex = 0;
        let currentFileIndex = 0;
        let isPreviewVisible = true;
        let previewTimeout;

        const spacesNav = document.getElementById('spaces-nav');
        const fileList = document.getElementById('file-list');
        const previewFrame = document.getElementById('preview-frame');
        const previewContainer = document.getElementById('preview-container');
        const previewBtnText = document.getElementById('preview-btn-text');
        const currentFileNameDisplay = document.getElementById('current-file-name');

        const editor = ace.edit("code-editor");
        editor.setTheme("ace/theme/chaos");
        
        // --- REQUIRE ACE MODELIST ---
        const modelist = ace.require("ace/ext/modelist");

        editor.setOptions({
            fontSize: "14px",
            showPrintMargin: false,
            enableBasicAutocompletion: true,
            enableLiveAutocompletion: true,
            tabSize: 4,
            useWorker: false 
        });

        editor.session.on('change', () => {
            const currentFile = spacesData[currentSpaceIndex].files[currentFileIndex];
            if (currentFile) {
                currentFile.content = editor.getValue();
                saveData();
                debouncedUpdatePreview();
            }
        });

        function saveData() {
            localStorage.setItem('astralCodeData_sleek_universal', JSON.stringify(spacesData));
        }

        // Updated Icon logic to fall back to a generic code file for unknown types
        function getFileIcon(filename) {
            if (filename.endsWith('.html')) return '<i class="ph ph-file-html" style="color: #fff"></i>';
            if (filename.endsWith('.css')) return '<i class="ph ph-file-css" style="color: #a3a3a3"></i>';
            if (filename.endsWith('.js') || filename.endsWith('.ts')) return '<i class="ph ph-file-js" style="color: #d4d4d4"></i>';
            if (filename.endsWith('.json')) return '<i class="ph ph-brackets-curly" style="color: #737373"></i>';
            if (filename.endsWith('.py')) return '<i class="ph ph-file-py" style="color: #d4d4d4"></i>';
            if (filename.endsWith('.cpp') || filename.endsWith('.c')) return '<i class="ph ph-file-c" style="color: #d4d4d4"></i>';
            return '<i class="ph ph-file-code" style="color: #737373"></i>';
        }

        // --- DYNAMIC MODE DETECTION ---
        function getEditorMode(filename) {
            // modelist.getModeForPath reads the file extension and returns the correct Ace Editor syntax mode
            return modelist.getModeForPath(filename).mode;
        }

        function renderSpacesNav() {
            spacesNav.innerHTML = '';
            spacesData.forEach((space, index) => {
                const btn = document.createElement('button');
                btn.className = `space-tab ${index === currentSpaceIndex ? 'active' : ''}`;
                btn.innerText = space.name;
                btn.onclick = () => switchSpace(index);
                spacesNav.appendChild(btn);
            });
        }

        function renderFileList() {
            fileList.innerHTML = '';
            const currentSpace = spacesData[currentSpaceIndex];

            currentSpace.files.forEach((file, index) => {
                const div = document.createElement('div');
                div.className = `file-item ${index === currentFileIndex ? 'active' : ''}`;
                div.onclick = () => switchFile(index);

                const nameContainer = document.createElement('div');
                nameContainer.className = 'file-item-name';
                nameContainer.innerHTML = `${getFileIcon(file.name)} <span>${file.name}</span>`;

                div.appendChild(nameContainer);

                if (currentSpace.files.length > 1) {
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'delete-file';
                    deleteBtn.innerHTML = '<i class="ph ph-x"></i>';
                    deleteBtn.onclick = (e) => {
                        e.stopPropagation();
                        deleteFile(index);
                    };
                    div.appendChild(deleteBtn);
                }

                fileList.appendChild(div);
            });
        }

        function loadEditorContent() {
            const currentFile = spacesData[currentSpaceIndex].files[currentFileIndex];
            if (currentFile) {
                editor.setValue(currentFile.content, -1);
                
                // Set dynamic mode based on the file extension
                editor.session.setMode(getEditorMode(currentFile.name));
                
                editor.setReadOnly(false);
                currentFileNameDisplay.innerText = currentFile.name;
                updatePreview();
            } else {
                editor.setValue('');
                editor.setReadOnly(true);
                currentFileNameDisplay.innerText = 'No files';
                previewFrame.srcdoc = '';
            }
        }

        function debouncedUpdatePreview() {
            clearTimeout(previewTimeout);
            previewTimeout = setTimeout(updatePreview, 500);
        }

        function updatePreview() {
            if (!isPreviewVisible) return;
            const currentFile = spacesData[currentSpaceIndex].files[currentFileIndex];
            if (currentFile && (currentFile.name.endsWith('.html') || currentFile.name.endsWith('.htm'))) {
                previewFrame.srcdoc = currentFile.content;
            } else if (currentFile) {
                const htmlFile = spacesData[currentSpaceIndex].files.find(f => f.name.endsWith('.html'));
                if (htmlFile) {
                     previewFrame.srcdoc = htmlFile.content;
                } else {
                     previewFrame.srcdoc = `<body style="background:#000; color:#a3a3a3; font-family:'Inter',sans-serif; padding:20px;"><i>Preview requires an HTML file.<br><br>Viewing code for: ${currentFile.name}</i></body>`;
                }
            }
        }

        function switchSpace(index) {
            currentSpaceIndex = index;
            currentFileIndex = 0;
            renderSpacesNav();
            renderFileList();
            loadEditorContent();
        }

        function switchFile(index) {
            currentFileIndex = index;
            renderFileList();
            loadEditorContent();
        }

        function addFile() {
            const fileName = prompt("Enter file name (e.g., script.py, main.cpp, server.js):", "newfile.html");
            if (fileName && fileName.trim() !== "") {
                if(spacesData[currentSpaceIndex].files.some(f => f.name === fileName.trim())) {
                    alert("A file with that name already exists!");
                    return;
                }
                spacesData[currentSpaceIndex].files.push({ name: fileName.trim(), content: '' });
                currentFileIndex = spacesData[currentSpaceIndex].files.length - 1;
                saveData();
                renderFileList();
                loadEditorContent();
            }
        }

        function deleteFile(index) {
            if (confirm(`Are you sure you want to delete ${spacesData[currentSpaceIndex].files[index].name}?`)) {
                spacesData[currentSpaceIndex].files.splice(index, 1);
                if (currentFileIndex >= spacesData[currentSpaceIndex].files.length) {
                    currentFileIndex = Math.max(0, spacesData[currentSpaceIndex].files.length - 1);
                }
                saveData();
                renderFileList();
                loadEditorContent();
            }
        }

        function togglePreview() {
            isPreviewVisible = !isPreviewVisible;
            if (isPreviewVisible) {
                previewContainer.classList.remove('hidden');
                previewBtnText.innerText = 'Hide Preview';
                updatePreview();
            } else {
                previewContainer.classList.add('hidden');
                previewBtnText.innerText = 'Show Preview';
            }
            setTimeout(() => editor.resize(), 300);
        }

        function openInNewTab() {
            const currentFile = spacesData[currentSpaceIndex].files[currentFileIndex];
            if (currentFile && currentFile.name.endsWith('.html')) {
                const newWindow = window.open('about:blank', '_blank');
                newWindow.document.write(currentFile.content);
                newWindow.document.close();
            } else {
                alert("Only HTML files can be opened in a new tab.");
            }
        }

        renderSpacesNav();
        renderFileList();
        loadEditorContent();

    </script>
</body>
</html>
