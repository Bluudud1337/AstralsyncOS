<!DOCTYPE html>  
<html lang="en">  
<head>  
<meta charset="UTF-8">  
<title>Khan Academy</title>  
<link rel="icon" href="https://academic-mathwork.vercel.app/icon-512.png">

<style>  
:root {  
    --aqua-primary: #00d2ff;  
    --aqua-secondary: #3a7bd5;  
    --glass-bg: rgba(255, 255, 255, 0.4);  
    --text-color: #004a7c;  
}

body {  
    margin: 0;  
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;  
    /* Classic Frutiger Aqua Gradient */  
    background: linear-gradient(135deg, #e0f7fa 0%, #80deea 50%, #4dd0e1 100%);  
    background-attachment: fixed;  
    color: var(--text-color);  
    text-align: center;  
    min-height: 100vh;  
}

/* HEADER */  
header {  
    padding: 20px 30px;  
    display: flex;  
    justify-content: flex-end;  
    gap: 15px;  
}

header button {  
    background: linear-gradient(to bottom, #ffffff 0%, #b2ebf2 100%);  
    border: 1px solid #80deea;  
    padding: 8px 20px;  
    color: var(--text-color);  
    font-size: 14px;  
    font-weight: bold;  
    cursor: pointer;  
    border-radius: 50px; /* Bubbly shape */  
    box-shadow: 0 4px 6px rgba(0,0,0,0.1), inset 0 1px 0 white;  
    transition: all .2s;  
}

header button:hover {  
    transform: translateY(-2px);  
    box-shadow: 0 6px 12px rgba(0,0,0,0.15);  
    background: linear-gradient(to bottom, #ffffff 0%, #80deea 100%);  
}

/* MAIN GLASS CONTAINER */  
.container {  
    margin-top: 60px;  
    background: var(--glass-bg);  
    backdrop-filter: blur(15px);  
    -webkit-backdrop-filter: blur(15px);  
    border: 1px solid rgba(255, 255, 255, 0.6);  
    border-radius: 30px;  
    padding: 40px;  
    max-width: 700px;  
    margin-left: auto;  
    margin-right: auto;  
    box-shadow: 0 20px 40px rgba(0,0,0,0.1), inset 0 0 20px rgba(255,255,255,0.5);  
}

h1 {  
    font-size: 42px;  
    color: #007eb9;  
    text-shadow: 0 2px 4px rgba(255,255,255,0.8);  
    margin-bottom: 10px;  
}

.subtitle {  
    font-size: 18px;  
    margin: 0 auto 30px;  
    color: #005b8e;  
}

/* INPUT AREA */  
#url {  
    width: 80%;  
    max-width: 400px;  
    padding: 15px;  
    border-radius: 25px;  
    border: 2px solid #fff;  
    background: rgba(255, 255, 255, 0.8);  
    color: var(--text-color);  
    font-size: 16px;  
    text-align: center;  
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.1), 0 5px 15px rgba(0,0,0,0.05);  
    outline: none;  
}

/* GLOSSY GO BUTTON */  
#goBtn {  
    margin-top: 25px;  
    background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%);  
    border: 1px solid #fff;  
    padding: 15px 50px;  
    color: white;  
    font-size: 20px;  
    font-weight: bold;  
    cursor: pointer;  
    border-radius: 50px;  
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);  
    box-shadow: 0 8px 15px rgba(79, 172, 254, 0.4), inset 0 2px 2px rgba(255,255,255,0.6);  
    transition: all .2s;  
}

#goBtn:hover {  
    transform: scale(1.05);  
    box-shadow: 0 12px 20px rgba(79, 172, 254, 0.6);  
}

/* LINKS SECTION */  
.links-section {  
    margin-top: 40px;  
    padding: 20px;  
    border-top: 1px solid rgba(255,255,255,0.5);  
}

.links-section h2 {  
    color: #007eb9;  
    font-size: 24px;  
}

.links-list {  
    font-size: 16px;  
    line-height: 1.8;  
    color: #005b8e;  
}

.links-list a {  
    color: #007eb9;  
    text-decoration: none;  
    font-weight: bold;  
    transition: color 0.2s;  
}

.links-list a:hover {  
    color: #00d2ff;  
    text-decoration: underline;  
}  
</style>  
</head>

<body>

<header> 
</header>

<div class="container">  
    <h1>Astral Blank Launcher</h1>

    <p class="subtitle">  
        Opens sites inside an <b>about:blank</b> tab.<br>  
        Only works for sites that allow embedding.  
    </p>

    <input id="url" placeholder="https://example.com">  
    <br>  
    <button id="goBtn" onclick="openSite()">Launch</button>

    <div class="links-section">  
        <h2>Fun sites to visit:</h2>  
        <div class="links-list">  
            <a href="https://allsonicgames.net">allsonicgames.net</a> (sonic games)<br>  
            <a href="https://kbhgames.com">kbhgames.com</a> (games)<br>  
            <a href="https://flixer.sh">flixer.sh</a> (movies)<br>  
            <a href="https://totallyscience.app">totallyscience.app</a> (games)<br>  
            <a href="https://maddox.page">maddox.page</a> (cloud gaming)  
        </div>  
    </div>  
</div>

<script>  
function openSite() {  
    let url = document.getElementById("url").value.trim();  
    if (!url) return;

    if (!url.startsWith("http")) {  
        url = "https://" + url;  
    }

    const tab = window.open("", "_blank");  
    if (!tab) return;

    tab.document.open();  
    tab.document.write(`  
    <!DOCTYPE html>  
    <html>  
    <head>  
    <title>about:blank</title>  
    <style>  
    html, body {  
    margin: 0;  
    padding: 0;  
    background: white;  
    height: 100%;  
    overflow: hidden;  
    }  
    iframe {  
    width: 100%;  
    height: 100%;  
    border: none;  
    }  
    </style>  
    </head>  
    <body>  
    <iframe src="${url}" allowfullscreen></iframe>  
    </body>  
    </html>  
    `);  
    tab.document.close();  
}  
</script>

</body>  
</html>
